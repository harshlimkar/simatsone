name: simats_one
description: "SIMATS ONE - Smart Campus Suite. One Campus. One App. One Connected Experience."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^14.6.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.2

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local Storage / Offline-First
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.25
  path_provider: ^2.1.5
  path: ^1.9.0

  # Security - JWT/token storage in Android Keystore
  flutter_secure_storage: ^9.2.4

  # Connectivity
  connectivity_plus: ^6.1.1

  # Image
  cached_network_image: ^3.4.1

  # Typography
  google_fonts: ^6.2.1

  # Environment Configuration
  flutter_dotenv: ^5.2.1

  # Logging
  logger: ^2.5.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  collection: ^1.18.0

  # URL Launcher / Deep Links
  url_launcher: ^6.3.1

  # Non-sensitive user preferences only
  shared_preferences: ^2.3.5

  # Background Work
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0
  riverpod_generator: ^2.4.3

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/images/
    - assets/icons/
    - .env
